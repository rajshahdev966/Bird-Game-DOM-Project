<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUNNEL FLAP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="preload" href="./gameplay-back.png" as="image">
<link rel="preload" href="./desktop-back.png" as="image">
<link rel="preload" href="./flappy-bird.png" as="image">
<link rel="preload" href="./tunnelLength.png" as="image">
<link rel="preload" href="./capForUP.png" as="image">
<link rel="preload" href="./capForDown.png" as="image">

</head>
<body>

<!-- GAME START SCREEN -->

    <main class="full-bg-arrange flex-center">
        <header>
            <h1>TUNNEL<br><span>FLAP</span></h1>
        </header>
        <img src="./flappy-bird.png" alt="Game Start Image" id="flappy-bird-start">
        <div class="start-control flex-center ">
            <button id="start-play-button">PLAY</button>
            <!-- <button id="start-set-button">SETTING</button> -->
        </div>
    </main>

<!-- GAME PLAY SCREEN -->

    <section id="game-play-screen" class="full-bg-arrange">
        <img src="./flappy-bird.png" alt="Bird Gameplay Character" id="bird-play-img">      
        <aside> <span id="live-score-display">012</span></aside>  
    </section>

<!-- GAME OVER SCREEN -->

    <dialog class="full-bg-arrange flex-center">
        <div class="game-over-box flex-center">
            <div class="game-over-text">
                <span>GAME <br></span>
                <span class="over-txt">OVER</span>
            </div>

            <img src="./game-over-bird.png" alt="Game Over Bird">
            <div class="score-table">
                <div class="score-text">
                    <span>SCORE</span>
                    <span  id="current-score"></span>
                </div>
                <div class="score-text">
                    <span>BEST SCORE</span>
                    <span id="best-score">1234</span>
                </div>
                
            </div>
            <div class="game-over-buttons">
                <button id="home-button">HOME</button>
                <!-- <button id="try-button"> TRY AGAIN</button> -->
            </div>
        </div>
    </dialog>




    <script src="script.js"></script>
</body>
</html>
